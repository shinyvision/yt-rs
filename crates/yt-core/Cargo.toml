[package]
name = "yt-core"
description = "YouTube logic without any UI: sign-in, InnerTube, feeds, watch-time reporting and stream lookup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64.workspace = true
bytes.workspace = true
regex.workspace = true
directories.workspace = true
keyring.workspace = true
rand.workspace = true
reqwest.workspace = true
rquickjs.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
yt-export.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true

# No prebuilt QuickJS bindings for Windows on ARM with MinGW: generate them.
[target.'cfg(all(target_os = "windows", target_arch = "aarch64", target_env = "gnu"))'.dependencies]
rquickjs = { workspace = true, features = ["bindgen"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
